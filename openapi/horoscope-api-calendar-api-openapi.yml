openapi: 3.2.0
info:
  title: FreeHoroscope Calendar API
  version: 1.1.0
  description: Free public JSON APIs for horoscope readings, tarot cards, planetary positions, Panchang and Sun/Moon times. No API key or account is required. Public data routes support GET and OPTIONS with cross-origin access without credentials. Horoscope responses use a data wrapper; tarot responses use nhits and cards; calculation responses have no wrapper. This document covers the public data API, not account management. All references are included in this file. Commercial and non-commercial API use is allowed with attribution. Include a visible Powered by FreeHoroscopeAPI link to https://freehoroscopeapi.com in your application, website, or public documentation. Upstream requests have a total deadline of 10 seconds for horoscopes and 30 seconds for calculations, including the response body. Successful upstream data must match the response schema. Gateway errors include a stable code and a readable error message.
  contact:
    name: FreeHoroscopeAPI
    url: https://freehoroscopeapi.com
    email: admin@freehoroscopeapi.com
  termsOfService: https://freehoroscopeapi.com/#usage-terms
servers:
- url: https://freehoroscopeapi.com
  description: Production API
security: []
tags:
- name: Calendar
  description: Location-based daily calendar and Sun/Moon data.
paths:
  /api/v1/panchang:
    get:
      operationId: getPanchang
      summary: Get daily Panchang
      description: Requires lat and one of lng, lon or long. The date defaults to local today. The window runs from sunrise to the next sunrise, with a labeled civil-day fallback if sunrise is unavailable. The entire calculation window must fall within 1900-01-01T00:00:00Z inclusive to 2053-01-01T00:00:00Z exclusive. Returns astronomical limbs using an approximate Lahiri model; festival and regional observance rules are not included. No data wrapper. The complete upstream body is checked against the response schema before it is returned. The total upstream deadline is 30 seconds. The timezone is derived from the coordinates and returned in the response; a timezone query parameter cannot override it. This endpoint has no include or timeformat parameter. Window and transition timestamps always use ISO-8601 with local UTC offsets.
      tags:
      - Calendar
      parameters:
      - $ref: '#/components/parameters/RequiredLatitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/LongitudeAlias'
      - $ref: '#/components/parameters/LongAlias'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Local day, calculation window and Panchang transitions.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Server-Timing:
              $ref: '#/components/headers/ServerTiming'
            Access-Control-Expose-Headers:
              $ref: '#/components/headers/ExposeHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Panchang'
              examples:
                MumbaiPanchang:
                  $ref: '#/components/examples/MumbaiPanchang'
        '400':
          description: Invalid coordinate, date, datetime, include option or calculation range.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationError'
              example:
                error: lat must be between -90 and 90
        '405':
          $ref: '#/components/responses/CalculationMethodNotAllowed'
        '502':
          $ref: '#/components/responses/CalculationBadGateway'
        '503':
          $ref: '#/components/responses/CalculationServiceUnavailable'
        '504':
          $ref: '#/components/responses/CalculationGatewayTimeout'
        default:
          description: A structured JSON error from the calculation service is passed through with its HTTP status and body. It contains an error string or a validation detail array. Errors are not cached. Malformed or non-JSON errors are replaced with HTTP 502.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationError'
    options:
      operationId: getPanchangPreflight
      summary: Check browser access
      tags:
      - Calendar
      responses:
        '204':
          $ref: '#/components/responses/Preflight'
  /api/v1/times:
    get:
      operationId: getSunMoonTimes
      summary: Get Sun, Moon and Rahu Kaal times
      description: Requires lat and one of lng, lon or long. Defaults to local today and 12-hour event strings. Set timeformat=24 for ISO-8601 event timestamps. With no date parameter, available today/tomorrow summaries are also included. Events can be null at polar locations, and Rahu Kaal can be absent. include=moon_details adds a separate local-noon calculation. No data wrapper. The complete upstream body is checked against the response schema before it is returned. The total upstream deadline is 30 seconds. The timezone is derived from the coordinates and returned in the response; a timezone query parameter cannot override it.
      tags:
      - Calendar
      parameters:
      - $ref: '#/components/parameters/RequiredLatitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/LongitudeAlias'
      - $ref: '#/components/parameters/LongAlias'
      - $ref: '#/components/parameters/Date'
      - $ref: '#/components/parameters/TimeFormat'
      - $ref: '#/components/parameters/MoonDetails'
      responses:
        '200':
          description: Local Sun and Moon events, with optional periods and summaries.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Server-Timing:
              $ref: '#/components/headers/ServerTiming'
            Access-Control-Expose-Headers:
              $ref: '#/components/headers/ExposeHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Times'
              examples:
                MumbaiTimes:
                  $ref: '#/components/examples/MumbaiTimes'
                PolarTimes:
                  $ref: '#/components/examples/PolarTimes'
                CurrentTimes:
                  $ref: '#/components/examples/CurrentTimes'
        '400':
          description: Invalid coordinate, date, datetime, include option or calculation range.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationError'
              example:
                error: lat must be between -90 and 90
        '405':
          $ref: '#/components/responses/CalculationMethodNotAllowed'
        '422':
          $ref: '#/components/responses/CalculationValidationFailed'
        '502':
          $ref: '#/components/responses/CalculationBadGateway'
        '503':
          $ref: '#/components/responses/CalculationServiceUnavailable'
        '504':
          $ref: '#/components/responses/CalculationGatewayTimeout'
        default:
          description: A structured JSON error from the calculation service is passed through with its HTTP status and body. It contains an error string or a validation detail array. Errors are not cached. Malformed or non-JSON errors are replaced with HTTP 502.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationError'
    options:
      operationId: getSunMoonTimesPreflight
      summary: Check browser access
      tags:
      - Calendar
      responses:
        '204':
          $ref: '#/components/responses/Preflight'
components:
  responses:
    CalculationServiceUnavailable:
      description: The calculation service is unavailable or not configured. A valid structured error returned by the calculation service with this status is passed through unchanged.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalculationError'
          example:
            error: The calculation service is not configured. Contact support.
            code: service_not_configured
    Preflight:
      description: Browser preflight accepted. No response body. Parameters are not validated and no upstream request is made.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/AllowMethods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/AllowHeaders'
    CalculationValidationFailed:
      description: The calculation service could not parse a parameter, such as a non-numeric coordinate. A valid structured error returned by the calculation service with this status is passed through unchanged.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalculationError'
          example:
            detail:
            - type: float_parsing
              loc:
              - query
              - lat
              msg: Input should be a valid number
              input: invalid
    CalculationGatewayTimeout:
      description: 'The upstream service exceeded the total request and body deadline: 10 seconds for horoscopes or 30 seconds for calculations. Retry later with a limited number of attempts and increasing delays. A valid structured error returned by the calculation service with this status is passed through unchanged.'
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalculationError'
          example:
            error: The upstream service took too long to respond. Try again later.
            code: upstream_timeout
    CalculationMethodNotAllowed:
      description: This endpoint supports GET and OPTIONS only. A valid structured error returned by the calculation service with this status is passed through unchanged.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Allow:
          $ref: '#/components/headers/Allow'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalculationError'
          example:
            error: Method not allowed. Use GET or OPTIONS.
            code: method_not_allowed
    CalculationBadGateway:
      description: The upstream request failed, returned an unexpected HTTP status, or returned invalid data. Responses must use a JSON content type and must not exceed 1 MiB. Successful data must match the documented schema. Horoscope signs and periods must also match the request. No partial data is returned. A valid structured error returned by the calculation service with this status is passed through unchanged.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AllowOrigin'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalculationError'
          examples:
            Unavailable:
              value:
                error: The upstream service is unavailable. Try again later.
                code: upstream_unavailable
            InvalidResponse:
              value:
                error: The upstream service returned invalid data. Try again later.
                code: invalid_upstream_response
  schemas:
    NakshatraValue:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 27
          description: Nakshatra index from 1 to 27.
        name:
          type: string
          description: Name of the sidereal lunar mansion.
      required:
      - number
      - name
    YogaLimb:
      type: object
      properties:
        at_start:
          $ref: '#/components/schemas/YogaValue'
        transitions:
          type: array
          items:
            type: object
            properties:
              datetime:
                type: string
                format: date-time
                description: Transition instant, in ISO-8601 with local UTC offset.
              to:
                $ref: '#/components/schemas/YogaValue'
            required:
            - datetime
            - to
          description: Transitions inside [window.start, window.end). An empty array means the value does not change in this window.
      required:
      - at_start
      - transitions
      description: Value at the start of the calculation window, followed by transitions in time order.
    TithiValue:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 30
          description: Tithi number from 1 to 30.
        name:
          type: string
          description: Tithi name, including Purnima or Amavasya at the end of each half.
        paksha:
          type: string
          enum:
          - Shukla
          - Krishna
          description: Shukla for the waxing half; Krishna for the waning half.
      required:
      - number
      - name
      - paksha
    EventTime:
      type:
      - string
      - 'null'
      description: Event timestamp in the local timezone. timeformat=12 returns YYYY-MM-DDThh:mm:ss AM/PM ±HHMM; timeformat=24 returns ISO-8601 with an offset. Null when the event does not occur. The default 12-hour string is not RFC 3339.
    Times:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Resolved local calendar date for the requested coordinates.
          example: '2026-10-01'
        location:
          $ref: '#/components/schemas/Location'
        timezone:
          type: string
          description: IANA timezone identifier derived from the coordinates, for example Asia/Kolkata, Europe/London or America/New_York. UTC is the fallback if no timezone is found. The value can be any timezone returned by the location database; it is not a fixed list. timezone is a response field, not a supported query parameter. Local dates and event offsets follow this timezone, including daylight saving time where applicable.
          example: Asia/Kolkata
          readOnly: true
        sun:
          $ref: '#/components/schemas/Sun'
        moon:
          $ref: '#/components/schemas/Moon'
        rahukaalam:
          $ref: '#/components/schemas/TimePeriod'
        today:
          $ref: '#/components/schemas/TodaySummary'
        tomorrow:
          $ref: '#/components/schemas/TomorrowSummary'
      required:
      - date
      - location
      - timezone
      - sun
      - moon
      description: No data wrapper. Rahu Kaal and some periods can be absent where the needed Sun events do not occur.
    Sun:
      type: object
      properties:
        events:
          $ref: '#/components/schemas/SunEvents'
        daylight:
          $ref: '#/components/schemas/Daylight'
        twilight_periods:
          type: object
          properties:
            civil:
              $ref: '#/components/schemas/TwilightMorningEvening'
            nautical:
              $ref: '#/components/schemas/TwilightMorningEvening'
            astronomical:
              $ref: '#/components/schemas/TwilightMorningEvening'
          required:
          - civil
          - nautical
          - astronomical
          description: Civil, nautical and astronomical twilight intervals, each with morning/evening bounds and a status.
        twilight:
          $ref: '#/components/schemas/MorningEvening'
        photography:
          type: object
          properties:
            golden_hour:
              $ref: '#/components/schemas/MorningEvening'
            blue_hour:
              $ref: '#/components/schemas/MorningEvening'
          description: Available golden_hour and blue_hour intervals. A period is omitted if its required crossings do not occur.
      required:
      - events
      - daylight
      - twilight_periods
      description: Sun events, daylight duration and available twilight and photography periods.
    Panchang:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Resolved local calendar date.
        location:
          $ref: '#/components/schemas/Location'
        timezone:
          type: string
          description: IANA timezone identifier derived from the coordinates, for example Asia/Kolkata, Europe/London or America/New_York. UTC is the fallback if no timezone is found. The value can be any timezone returned by the location database; it is not a fixed list. timezone is a response field, not a supported query parameter. Local dates and event offsets follow this timezone, including daylight saving time where applicable.
          example: Asia/Kolkata
          readOnly: true
        window:
          $ref: '#/components/schemas/CalendarWindow'
        day_basis:
          type: string
          enum:
          - sunrise_to_next_sunrise
          - civil_day_fallback_no_sunrise
          description: sunrise_to_next_sunrise uses consecutive local sunrises. civil_day_fallback_no_sunrise uses local midnight to midnight when sunrise is unavailable.
        weekday:
          type: string
          description: English weekday name for the requested local date.
          example: Thursday
        tithi:
          $ref: '#/components/schemas/TithiLimb'
        nakshatra:
          $ref: '#/components/schemas/NakshatraLimb'
        yoga:
          $ref: '#/components/schemas/YogaLimb'
        karana:
          $ref: '#/components/schemas/KaranaLimb'
        conventions:
          type: object
          additionalProperties:
            type: string
          description: Calculation conventions for ayanamsa, positions, tithi, nakshatra, yoga, karana and scope.
      required:
      - date
      - location
      - timezone
      - window
      - day_basis
      - weekday
      - tithi
      - nakshatra
      - yoga
      - karana
      - conventions
      description: Daily astronomical Panchang, with each limb evaluated at the window start and all transitions inside the window. There is no data wrapper.
    TithiLimb:
      type: object
      properties:
        at_start:
          $ref: '#/components/schemas/TithiValue'
        transitions:
          type: array
          items:
            type: object
            properties:
              datetime:
                type: string
                format: date-time
                description: Transition instant, in ISO-8601 with local UTC offset.
              to:
                $ref: '#/components/schemas/TithiValue'
            required:
            - datetime
            - to
          description: Transitions inside [window.start, window.end). An empty array means the value does not change in this window.
      required:
      - at_start
      - transitions
      description: Value at the start of the calculation window, followed by transitions in time order.
    KaranaLimb:
      type: object
      properties:
        at_start:
          $ref: '#/components/schemas/KaranaValue'
        transitions:
          type: array
          items:
            type: object
            properties:
              datetime:
                type: string
                format: date-time
                description: Transition instant, in ISO-8601 with local UTC offset.
              to:
                $ref: '#/components/schemas/KaranaValue'
            required:
            - datetime
            - to
          description: Transitions inside [window.start, window.end). An empty array means the value does not change in this window.
      required:
      - at_start
      - transitions
      description: Value at the start of the calculation window, followed by transitions in time order.
    Moon:
      type: object
      properties:
        moonrise:
          $ref: '#/components/schemas/EventTime'
        moonset:
          $ref: '#/components/schemas/EventTime'
        phase_value:
          type: number
          description: Astral phase value, approximately 0 to 28; not illumination percent.
        phase_description:
          type: string
          description: Readable Moon phase name associated with phase_value.
          example: Waxing Gibbous
        error:
          type: string
          description: Calculation message when one or more Moon events are unavailable. Independently available fields remain present.
        details:
          $ref: '#/components/schemas/MoonDetails'
      required:
      - moonrise
      - moonset
      - phase_value
      - phase_description
      description: Moonrise, moonset and approximate phase, with optional precise Moon details.
    NakshatraLimb:
      type: object
      properties:
        at_start:
          $ref: '#/components/schemas/NakshatraValue'
        transitions:
          type: array
          items:
            type: object
            properties:
              datetime:
                type: string
                format: date-time
                description: Transition instant, in ISO-8601 with local UTC offset.
              to:
                $ref: '#/components/schemas/NakshatraValue'
            required:
            - datetime
            - to
          description: Transitions inside [window.start, window.end). An empty array means the value does not change in this window.
      required:
      - at_start
      - transitions
      description: Value at the start of the calculation window, followed by transitions in time order.
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message.
          minLength: 1
          pattern: \S
        code:
          type: string
          description: 'Stable code for errors generated by this API: missing_sign, invalid_sign, invalid_count, method_not_allowed, upstream_unavailable, invalid_upstream_response, upstream_timeout or service_not_configured. Errors passed through from the calculation service can omit code or use a service-specific code such as invalid_parameter.'
      required:
      - error
    TodaySummary:
      type: object
      properties:
        day_progress_pct:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Rounded percentage of the sunrise-to-sunset interval already elapsed, clamped to 0–100. Null when the required events are unavailable.
        daylight_remaining_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Daylight remaining from the request time until the end of the local day, in seconds. Null when unavailable.
        sunrise:
          type:
          - string
          - 'null'
          description: 'Short local clock time: h:mm AM/PM for timeformat=12, or HH:mm for timeformat=24. No date or UTC offset is included. Null when the event is unavailable.'
          example: 06:30
        sunset:
          type:
          - string
          - 'null'
          description: 'Short local clock time: h:mm AM/PM for timeformat=12, or HH:mm for timeformat=24. No date or UTC offset is included. Null when the event is unavailable.'
          example: 06:30
      required:
      - day_progress_pct
      - daylight_remaining_seconds
      - sunrise
      - sunset
      description: Present when date is omitted and the summary is available. Sunrise and sunset use short clock times.
    TimePeriod:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/EventTime'
        end:
          $ref: '#/components/schemas/EventTime'
      required:
      - start
      - end
    TwilightMorningEvening:
      type: object
      properties:
        morning:
          $ref: '#/components/schemas/TwilightPeriod'
        evening:
          $ref: '#/components/schemas/TwilightPeriod'
      required:
      - morning
      - evening
    Location:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in degrees north of the equator; negative values are south.
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in degrees east of Greenwich; negative values are west. The response always uses lon, regardless of the request alias.
      required:
      - lat
      - lon
      description: Responses use lon even when the request uses lng or long.
    SunEvents:
      type: object
      properties:
        dawn:
          $ref: '#/components/schemas/EventTime'
        sunrise:
          $ref: '#/components/schemas/EventTime'
        noon:
          $ref: '#/components/schemas/EventTime'
        sunset:
          $ref: '#/components/schemas/EventTime'
        dusk:
          $ref: '#/components/schemas/EventTime'
        error:
          type: string
          description: Present when some events are unavailable.
      required:
      - dawn
      - sunrise
      - noon
      - sunset
      - dusk
    TomorrowSummary:
      type: object
      properties:
        sunrise:
          type:
          - string
          - 'null'
          description: 'Short local clock time: h:mm AM/PM for timeformat=12, or HH:mm for timeformat=24. No date or UTC offset is included. Null when the event is unavailable.'
          example: 06:30
        sunset:
          type:
          - string
          - 'null'
          description: 'Short local clock time: h:mm AM/PM for timeformat=12, or HH:mm for timeformat=24. No date or UTC offset is included. Null when the event is unavailable.'
          example: 06:30
      required:
      - sunrise
      - sunset
      description: Present when date is omitted and the summary is available. Sunrise and sunset use short clock times.
    MorningEvening:
      type: object
      properties:
        morning:
          $ref: '#/components/schemas/TimePeriod'
        evening:
          $ref: '#/components/schemas/TimePeriod'
      required:
      - morning
      - evening
    KaranaValue:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 60
          description: Half-tithi index from 1 to 60.
        name:
          type: string
          description: Karana name for the half-tithi.
      required:
      - number
      - name
    YogaValue:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 27
          description: Yoga index from 1 to 27.
        name:
          type: string
          description: Yoga name from the sidereal Sun-plus-Moon longitude.
      required:
      - number
      - name
    CalculationError:
      description: A structured error from the calculation service or an error generated by the API. Generated errors always include code. Upstream errors can omit code or use service-specific codes.
      anyOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/ValidationError'
    MoonDetails:
      type: object
      properties:
        evaluated_at:
          type: string
          format: date-time
          description: Local noon on the requested date, always ISO-8601.
        status:
          type: string
          enum:
          - ok
          - outside_supported_range
          description: ok when calculated, or outside_supported_range when local noon falls outside the supported UTC interval.
        illumination_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
          description: Illuminated portion of the Moon, from 0 to 100 percent. Null outside the supported interval.
        phase_angle_deg:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 360
          description: Sun–Moon ecliptic longitude separation, from 0 to 360 degrees. Null outside the supported interval.
      required:
      - evaluated_at
      - status
      - illumination_pct
      - phase_angle_deg
      description: Optional Moon calculation, present only with include=moon_details. Evaluated at local noon on the requested date.
    TwilightPeriod:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/EventTime'
        end:
          $ref: '#/components/schemas/EventTime'
        status:
          type: string
          enum:
          - ok
          - no_crossing
          description: ok when both crossings occur; no_crossing when the requested twilight boundary is not crossed.
      required:
      - start
      - end
      - status
    Daylight:
      type: object
      properties:
        duration_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Total daylight during the local calendar day, in seconds. Null when unavailable.
        change_from_yesterday_seconds:
          type:
          - integer
          - 'null'
          description: Difference from the previous local day, in seconds. Negative means a shorter day. Null when unavailable.
        status:
          type: string
          enum:
          - normal
          - polar_day
          - polar_night
          - unavailable
          description: normal for a day with crossings, polar_day for continuous daylight, polar_night for continuous darkness, or unavailable when the duration cannot be calculated.
      required:
      - duration_seconds
      - change_from_yesterday_seconds
      - status
    CalendarWindow:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive start of the calculation window, in ISO-8601 with local UTC offset.
        end:
          type: string
          format: date-time
          description: Exclusive end of the calculation window, in ISO-8601 with local UTC offset.
        end_exclusive:
          type: boolean
          enum:
          - true
          description: Always true. A transition at end belongs to the next window.
      required:
      - start
      - end
      - end_exclusive
    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: integer
              msg:
                type: string
              type:
                type: string
              input:
                description: The invalid value, when supplied by the upstream validator.
              ctx:
                type: object
                additionalProperties: true
            required:
            - loc
            - msg
            - type
      required:
      - detail
      description: Upstream parameter type errors can use this format with HTTP 422.
