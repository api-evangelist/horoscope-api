  parameters:
    LongitudeAlias:
      name: lon
      in: query
      description: Alternative to lng. Used only when lng is absent. Supply lat as well.
      required: false
      schema:
        type: number
        minimum: -180
        maximum: 180
      example: 72.878
      x-default-description: No default. This is an alternative longitude parameter, not an additional coordinate.
    Longitude:
      name: lng
      in: query
      description: Longitude in degrees. Required with lat unless lon or long is supplied. The API checks lng first, then lon, then long. OpenAPI cannot express this dependency between query parameters.
      required: false
      schema:
        type: number
        minimum: -180
        maximum: 180
      example: 72.878
      x-default-description: Use lon, then long, if lng is absent. A longitude is required whenever lat is supplied.
    LongAlias:
      name: long
      in: query
      description: Alternative to lng and lon. Used only when both are absent. Supply lat as well.
      required: false
      schema:
        type: number
        minimum: -180
        maximum: 180
      example: 72.878
      x-default-description: No default. This is an alternative longitude parameter, not an additional coordinate.
    Date:
      name: date
      in: query
      description: Local calendar date in YYYY-MM-DD format. Omit the parameter or leave it empty to use today in the timezone derived from the coordinates. Panchang uses the date to select sunrise through the next sunrise. For Sun and Moon times, an explicit date omits the live today and tomorrow summaries.
      required: false
      schema:
        type: string
        format: date
      example: '2026-10-01'
      x-default-description: Today in the timezone derived from the coordinates.
      allowEmptyValue: true
    TimeFormat:
      name: timeformat
      in: query
      description: Event time display. Use 12 for YYYY-MM-DDThh:mm:ss AM/PM ±HHMM (for example, 2026-10-01T06:30:00 AM +0530). Use 24 for ISO-8601 with the local UTC offset (for example, 2026-10-01T06:30:00+05:30). The short sunrise and sunset values in today/tomorrow use h:mm AM/PM or HH:mm. moon.details.evaluated_at always uses ISO-8601. Only the exact strings 12 and 24 are accepted.
      required: false
      schema:
        type: string
        enum:
        - '12'
        - '24'
        default: '12'
        x-enumDescriptions:
          '12': 12-hour event times with AM/PM and UTC offset. API default.
          '24': ISO-8601 event timestamps with UTC offset. Playground preset.
      example: '24'
    MoonDetails:
      name: include
      in: query
      description: Add moon.details with illumination_pct, phase_angle_deg, evaluated_at and status. The calculation uses local noon on the selected date, not the current time. evaluated_at is always ISO-8601, independent of timeformat. Outside the supported UTC interval from 1900-01-01 inclusive to 2053-01-01 exclusive, illumination_pct and phase_angle_deg are null and status is outside_supported_range. This endpoint accepts only moon_details. Omit include or send an empty value for the standard response. The parameter is a comma-separated list; whitespace and duplicate entries are ignored. Unknown values return HTTP 400.
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - moon_details
        default: []
      style: form
      explode: false
      allowEmptyValue: true
      example:
      - moon_details
      x-default-description: No extra fields. Omit include or leave its value empty.
    RequiredLatitude:
      name: lat
      in: query
      description: Latitude in degrees. Also supply lng, lon or long.
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      example: 19.076
